name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    # Критерий 1: Использование self-hosted runner
    runs-on: [self-hosted, macOS, ARM64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Критерий 3: Секреты подставляются в .env
      - name: Create .env file from secrets
        run: |
          echo "Creating .env file from GitHub Secrets..."
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          EOF
          echo ".env file created successfully"
          cat .env | sed 's/=.*/=***/'

      # Критерий 2: Workflow выполняет docker compose up -d
      - name: Deploy with Docker Compose
        run: |
          echo "Cleaning up old containers..."
          # Жестко убиваем старые контейнеры по именам, если они зависли
          docker rm -f app app-db || true
          docker compose down || true
          
          echo "Starting application stack..."
          docker compose up -d --build
          echo "Waiting for services to start..."
          sleep 20
          docker compose ps

      # Критерий 2: Контейнеры запущены (running)
      - name: Verify containers are running
        run: |
          if docker compose ps | grep -q "Up"; then
            echo "All containers are running"
          else
            echo "Some containers failed to start"
            docker compose logs
            exit 1
          fi

      # Критерий 4: Тестирование приложения
      - name: Run application tests
        run: |
          echo "1. Testing application and database connectivity..."
          sleep 5 
          
          if curl -f http://localhost:${{ secrets.APP_PORT }}/health; then
            echo "Web application is healthy"
          else
            echo "Web application health check failed"
            exit 1
          fi

          echo "2. Testing data consistency..."
          DB_COUNT=$(docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;" | tr -d ' ')
          WEB_COUNT=$(curl -s http://localhost:${{ secrets.APP_PORT }}/api/items/count)
          
          echo "Database count: $DB_COUNT"
          echo "Web API count: $WEB_COUNT"
          
          if [ "$DB_COUNT" = "$WEB_COUNT" ]; then
            echo "Data consistency test passed"
          else
            echo "Data consistency test failed"
            exit 1
          fi

      # Критерий 3: Создание и сохранение артефактов
      - name: Create test report
        run: |
          echo "Creating test report..."
          cat > test-report.md << EOF
          # Deployment Test Report
          - Date: $(date)
          - Application: Healthy
          - Database: Connected
          - Data Consistency: Passed
          - Containers: Running
          EOF

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
          retention-days: 30

      - name: Save Docker logs
        if: always()
        run: |
          docker compose logs > deployment-logs.txt
          docker images > docker-images.txt
          docker ps -a > docker-ps.txt

      - name: Upload Docker logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30